# Cloud Build config for the Life AI devnet Safe UI.
#
# A Cloud Build trigger runs this on every push to dev. It builds the image,
# pushes two tags (an immutable one and a moving `dev` tag), then deploys the
# immutable tag to Cloud Run. The life-devops Pulumi project ignores the live
# image, so `pulumi up --refresh` there does not revert this deploy.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - deploy/lifeai/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_GATEWAY_URL_PRODUCTION=${_GATEWAY_URL}
      - --build-arg
      - NEXT_PUBLIC_DEFAULT_MAINNET_CHAIN_ID=${_CHAIN_ID}
      - --build-arg
      - NEXT_PUBLIC_SAFE_VERSION=${_SAFE_VERSION}
      - --build-arg
      - NEXT_PUBLIC_BRAND_NAME=${_BRAND_NAME}
      - --tag
      - ${_IMAGE}:${_TAG_PREFIX}-${SHORT_SHA}
      - --tag
      - ${_IMAGE}:${_TAG_PREFIX}
      - .
  # `images:` pushes only after every step ends, so push before the deploy.
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE}:${_TAG_PREFIX}-${SHORT_SHA}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE_NAME}
      - --image=${_IMAGE}:${_TAG_PREFIX}-${SHORT_SHA}
      - --region=${_DEPLOY_REGION}
      - --update-labels=commit-sha=${COMMIT_SHA},gcb-build-id=${BUILD_ID}
      - --quiet
images:
  - ${_IMAGE}:${_TAG_PREFIX}-${SHORT_SHA}
  - ${_IMAGE}:${_TAG_PREFIX}
timeout: 3600s
substitutions:
  _IMAGE: asia-southeast1-docker.pkg.dev/lifeai-438107/life-ai/safe-ui
  _TAG_PREFIX: devnet-dev
  _GATEWAY_URL: https://safe-api-devnet-k44qyb6rgq-as.a.run.app/cgw
  _CHAIN_ID: "94909"
  _SAFE_VERSION: "1.4.1"
  _BRAND_NAME: LifeAI Safe Wallet
  _SERVICE_NAME: safe-ui-devnet
  _DEPLOY_REGION: asia-southeast1
options:
  logging: CLOUD_LOGGING_ONLY
  # Trigger-level substitutions that this file does not use must not fail the build.
  substitutionOption: ALLOW_LOOSE
  machineType: E2_HIGHCPU_8
