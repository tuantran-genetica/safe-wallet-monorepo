# Cloud Build config for the Life AI devnet Safe UI.
#
# A Cloud Build trigger runs this on every push to dev. It builds the image and
# pushes two tags: an immutable one for Pulumi to pin, and a moving `dev` tag.
# It does not deploy. Deployment stays an explicit `pulumi up --refresh` in the
# life-devops repository, because Pulumi owns the image field for this service.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - deploy/lifeai/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_GATEWAY_URL_PRODUCTION=${_GATEWAY_URL}
      - --build-arg
      - NEXT_PUBLIC_DEFAULT_MAINNET_CHAIN_ID=${_CHAIN_ID}
      - --build-arg
      - NEXT_PUBLIC_SAFE_VERSION=${_SAFE_VERSION}
      - --tag
      - ${_IMAGE}:${_TAG_PREFIX}-${SHORT_SHA}
      - --tag
      - ${_IMAGE}:${_TAG_PREFIX}
      - .
images:
  - ${_IMAGE}:${_TAG_PREFIX}-${SHORT_SHA}
  - ${_IMAGE}:${_TAG_PREFIX}
timeout: 3600s
substitutions:
  _IMAGE: asia-southeast1-docker.pkg.dev/lifeai-438107/life-ai/safe-ui
  _TAG_PREFIX: devnet-dev
  _GATEWAY_URL: https://safe-api-devnet-k44qyb6rgq-as.a.run.app/cgw
  _CHAIN_ID: "94909"
  _SAFE_VERSION: "1.4.1"
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
